<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dadarba // Проекты</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 24px 14px 60px; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 22px; color: #fff; font-weight: 800; }
        .header p { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; max-width: 800px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; backdrop-filter: blur(8px); }
        .card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .card-icon { font-size: 32px; background: rgba(255,255,255,0.05); border-radius: 10px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
        .card-title { font-size: 16px; font-weight: 800; color: #fff; }
        .card-tag { font-size: 9px; text-transform: uppercase; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: rgba(56, 189, 248, 0.15); color: var(--accent); margin-top: 2px; display: inline-block; }
        .card-desc { font-size: 12px; color: var(--text-dim); line-height: 1.4; margin-bottom: 16px; }
        .card-actions { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 10px; font-size: 12px; font-weight: 800; border-radius: 8px; border: none; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-run { background: var(--accent); color: #000; }
        .btn-code { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); }

        #runner-modal { display: none; position: fixed; inset: 0; z-index: 10000; background: #000; flex-direction: column; }
        .runner-bar { height: 44px; background: #0f172a; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 12px; }
        .runner-title { font-size: 13px; font-weight: bold; color: var(--accent); }
        .runner-close { background: #ef4444; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 900; cursor: pointer; }
        #runner-frame { flex: 1; border: none; width: 100%; height: calc(100% - 44px); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Каталог проектов Dadarba</h1>
        <p>Веб-витрина // Запуск проектов из приватных репозиториев</p>
    </div>

    <div class="grid">
        <!-- КАРТОЧКА: VYACHESLAV OS -->
        <div class="card">
            <div>
                <div class="card-top">
                    <div class="card-icon">👑</div>
                    <div>
                        <div class="card-title">Vyacheslav OS</div>
                        <span class="card-tag">Web OS // Cyber Core</span>
                    </div>
                </div>
                <div class="card-desc">
                    Полноценная браузерная ОС: каталог игр, пасхалки, консоль Cyber CLI, кейсы и защита 2FA.
                </div>
            </div>
            <div class="card-actions">
                <!-- Замените ССЫЛКУ ниже на полученный URL вашего задеплоенного приватного репозитория -->
                <button class="btn btn-run" onclick="launchProject('projects/vyacheslav-os/index.html', 'Vyacheslav OS')">▶ Запустить проект</button>
                <a href="https://github.com/Dadarba/native-os" target="_blank" class="btn btn-code">GitHub (Private)</a>
            </div>
        </div>
    </div>

    <!-- ФРЕЙМ ЗАПУСКА ПРОЕКТА -->
    <div id="runner-modal">
        <div class="runner-bar">
            <span class="runner-title" id="runner-app-title">⚡ Запуск</span>
            <button class="runner-close" onclick="closeProject()">✕ Закрыть и выйти</button>
        </div>
        <iframe id="runner-frame" src="about:blank"></iframe>
    </div>

    <script>
        function launchProject(url, title) {
            document.getElementById('runner-app-title').innerText = '▶ ' + title;
            document.getElementById('runner-frame').src = url;
            document.getElementById('runner-modal').style.display = 'flex';
        }
        function closeProject() {
            document.getElementById('runner-frame').src = 'about:blank';
            document.getElementById('runner-modal').style.display = 'none';
        }
    </script>
</body>
</html>
